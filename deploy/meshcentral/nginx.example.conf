# Example nginx reverse proxy for MeshCentral (HTTPS + WSS).
# Replace hosts and certificate paths. Do not commit production secrets.
# Keep MeshCentral settings.webRTC = false forever (Relay-only).
# Desktop / Files sessions need long timeouts — do not use default 60s.
#
# Production (public IP, no domain): Let's Encrypt IP Address Certificate
#   ssl_certificate     /etc/letsencrypt/live/203.0.113.10/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/203.0.113.10/privkey.pem;
# Issued with: certbot certonly --preferred-profile shortlived --webroot ... --ip-address <IP>
# Renew: snap.certbot.renew.timer + deploy-hook systemctl reload nginx

upstream wxqk_meshcentral {
    server 127.0.0.1:443;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mesh.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mesh.example.invalid;

    ssl_certificate     /etc/ssl/certs/mesh.example.invalid.crt;
    ssl_certificate_key /etc/ssl/private/mesh.example.invalid.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MeshSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512m;
    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass https://wxqk_meshcentral;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Upstream is local MeshCentral TLS; verify when using a real CA name.
        proxy_ssl_server_name on;
        proxy_ssl_name mesh.example.invalid;
        proxy_ssl_verify off;
        proxy_buffering off;
    }
}

# Agent port 4433 is usually exposed directly to agents (TCP).
# If you terminate TLS in front of AgentPort, configure MeshCentral
# settings.TlsOffload / AliasPort accordingly — do not invent paths.
