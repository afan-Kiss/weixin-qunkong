<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>html,body{margin:0;width:1px;height:1px;overflow:hidden;background:#000}</style>
  <script src="./vendor/livekit-client.umd.js"></script>
</head>
<body>
<script>
(function () {
  const LK = window.LivekitClient || window.livekit || null;
  let room = null;
  let localStream = null;
  let sessionId = '';
  let starting = false;
  let queuedCmd = null;
  let cmdChain = Promise.resolve();
  let publishedTrack = null;
  let roomEpoch = 0;
  let lastUrl = '';
  let lastToken = '';
  let autoReconnectTimer = null;
  let intentionalStop = false;
  let reconnectAttempt = 0;

  function post(type, payload) {
    try { window.wxPub && window.wxPub.send(type, payload || {}) } catch (_) {}
  }

  function clearAutoReconnect() {
    if (autoReconnectTimer) {
      clearTimeout(autoReconnectTimer);
      autoReconnectTimer = null;
    }
  }

  /**
   * @param {boolean} keepStream 保留抓屏轨
   * @param {any} [onlyRoom] 仅清理指定 Room，避免旧房 disconnected 拆掉新房
   * @param {{ skipUnpublish?: boolean }} [opts]
   */
  async function stopMedia(keepStream, onlyRoom, opts) {
    const skipUnpublish = !!(opts && opts.skipUnpublish);
    const active = room;
    if (onlyRoom && active && onlyRoom !== active) {
      try { await onlyRoom.disconnect(); } catch (_) {}
      return;
    }
    try {
      // 已断线房间再 unpublish 无意义，且会拉长观众侧无轨窗口
      if (!skipUnpublish && publishedTrack && active) {
        try { await active.localParticipant?.unpublishTrack(publishedTrack); } catch (_) {}
      }
      if (!keepStream && publishedTrack) {
        try { publishedTrack.stop(); } catch (_) {}
      }
      if (!keepStream) publishedTrack = null;
    } catch (_) {}
    if (active && (!onlyRoom || onlyRoom === active)) {
      room = null;
      try { await active.disconnect(); } catch (_) {}
    } else if (onlyRoom && onlyRoom !== active) {
      try { await onlyRoom.disconnect(); } catch (_) {}
    }
    if (!keepStream && localStream) {
      try {
        localStream.getTracks().forEach((t) => {
          try { t.onended = null } catch (_) {}
          try { t.stop() } catch (_) {}
        });
      } catch (_) {}
      localStream = null;
      publishedTrack = null;
    }
  }

  function scheduleAutoReconnect(reason) {
    if (intentionalStop || !lastUrl || !lastToken) {
      post('stopped', { reason: reason || 'disconnected' });
      return;
    }
    clearAutoReconnect();
    reconnectAttempt = Math.min(8, (reconnectAttempt || 0) + 1);
    // 0.6s → ~30s，避免 token/身份冲突时 600ms 狂打 LiveKit
    const delay = Math.min(30000, Math.round(600 * Math.pow(1.7, reconnectAttempt - 1)));
    post('state', {
      connectionState: 'reconnecting',
      transport: 'livekit',
      reason: String(reason || ''),
      attempt: reconnectAttempt,
      delayMs: delay,
    });
    autoReconnectTimer = setTimeout(() => {
      autoReconnectTimer = null;
      if (intentionalStop) return;
      void startSession({
        op: 'start',
        desktopSessionId: sessionId,
        livekitUrl: lastUrl,
        livekitToken: lastToken,
      });
    }, delay);
  }

  function bindTrackEnded(stream) {
    if (!stream) return;
    stream.getTracks().forEach((track) => {
      track.onended = () => {
        // 勿先 post('error')：主进程会 mediaConnected=false → JPEG/硬拉与热恢复打架 → 黑闪
        post('state', { connectionState: 'reconnecting', transport: 'livekit', reason: 'capture_track_ended' });
        void (async () => {
          try {
            if (localStream === stream) localStream = null;
            publishedTrack = null;
            const next = await ensureStream();
            const vt = next.getVideoTracks()[0];
            if (room && vt && room.localParticipant) {
              await room.localParticipant.publishTrack(vt, {
                name: 'desktop',
                source: LK.Track.Source.ScreenShare,
              });
              publishedTrack = vt;
              post('state', { connectionState: 'connected', transport: 'livekit', recovered: true });
              return;
            }
            scheduleAutoReconnect('capture_track_ended');
          } catch (_) {
            scheduleAutoReconnect('capture_track_ended_fail');
          }
        })();
      };
    });
  }

  async function ensureStream() {
    if (localStream) {
      const live = localStream.getVideoTracks().filter((t) => t.readyState === 'live');
      if (live.length) return localStream;
      try { localStream.getTracks().forEach((t) => t.stop()); } catch (_) {}
      localStream = null;
    }
    // 告知主进程：抓屏中，JPEG 必须让路（Windows desktopCapturer 双开会卡死）
    post('state', { connectionState: 'capturing', transport: 'livekit' });
    var mediaPromise = navigator.mediaDevices.getDisplayMedia({
      audio: false,
      video: {
        width: { ideal: 1280, max: 1280 },
        height: { ideal: 720, max: 720 },
        frameRate: { ideal: 12, max: 15 },
      },
    });
    var settled = false;
    var captureTimer = null;
    try {
      localStream = await new Promise(function (resolve, reject) {
        captureTimer = setTimeout(function () {
          captureTimer = null;
          if (settled) return;
          settled = true;
          reject(new Error('getDisplayMedia_timeout'));
          // 如果 getDisplayMedia 晚到，stop 那个晚到 stream
          mediaPromise.then(function (s) {
            try { s && s.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
          }, function () {});
        }, 25000);
        mediaPromise.then(function (stream) {
          if (settled) {
            // timeout 已先发生，stop 这个晚到 stream
            try { stream && stream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
            return;
          }
          settled = true;
          if (captureTimer) { clearTimeout(captureTimer); captureTimer = null; }
          resolve(stream);
        }, function (err) {
          if (settled) return;
          settled = true;
          if (captureTimer) { clearTimeout(captureTimer); captureTimer = null; }
          reject(err);
        });
      });
    } catch (error) {
      if (captureTimer) { clearTimeout(captureTimer); captureTimer = null; }
      post('state', {
        connectionState: 'failed',
        transport: 'livekit',
        reason: String((error && error.message) || error || 'ensureStream_failed'),
      });
      throw error;
    }
    try {
      localStream.getVideoTracks().forEach((t) => {
        try { t.contentHint = 'detail'; } catch (_) {}
      });
    } catch (_) {}
    bindTrackEnded(localStream);
    return localStream;
  }

  async function startSession(cmd) {
    if (!LK || !LK.Room) {
      post('error', { message: 'livekit_sdk_missing' });
      return;
    }
    if (starting) {
      queuedCmd = cmd || queuedCmd;
      return;
    }
    starting = true;
    queuedCmd = null;
    intentionalStop = false;
    clearAutoReconnect();
    const myEpoch = ++roomEpoch;
    try {
      const nextSid = String((cmd && cmd.desktopSessionId) || sessionId || '');
      const url = String((cmd && cmd.livekitUrl) || lastUrl || '');
      const token = String((cmd && cmd.livekitToken) || lastToken || '');
      const force = String((cmd && cmd.op) || '') === 'restart';
      if (!url || !token) {
        throw new Error('livekit_url_or_token_missing');
      }
      lastUrl = url;
      lastToken = token;
      const connected = !!(room && room.state === (LK.ConnectionState && LK.ConnectionState.Connected
        ? LK.ConnectionState.Connected
        : 'connected'));
      if (!force && connected && publishedTrack && publishedTrack.readyState === 'live') {
        if (nextSid) sessionId = nextSid;
        reconnectAttempt = 0;
        post('state', { connectionState: 'connected', reused: true, transport: 'livekit' });
        return;
      }
      sessionId = nextSid;
      const prevRoom = room;
      // 已断线的旧房：跳过 unpublish，缩短观众无轨窗口
      await stopMedia(true, prevRoom || undefined, { skipUnpublish: !connected });
      if (myEpoch !== roomEpoch) return;
      const stream = await ensureStream();
      const videoTrack = stream.getVideoTracks()[0];
      if (!videoTrack) throw new Error('no_video_track');

      // 屏幕墙多路并发：900kbps@15fps 足够；1.5Mbps 会成倍烧上行
      const nextRoom = new LK.Room({
        adaptiveStream: false,
        dynacast: false,
        publishDefaults: {
          videoEncoding: { maxBitrate: 900_000, maxFramerate: 15 },
          videoCodec: 'vp8',
          simulcast: false,
          scalabilityMode: undefined,
        },
      });
      room = nextRoom;
      nextRoom.on(LK.RoomEvent.ConnectionStateChanged, (st) => {
        if (room !== nextRoom) return;
        const name = String(st || '');
        const connectedEnum = LK.ConnectionState && LK.ConnectionState.Connected;
        const reconnectEnum = LK.ConnectionState && LK.ConnectionState.Reconnecting;
        const live = name === 'connected' || name === connectedEnum
          || name === 'reconnecting' || name === reconnectEnum
          || name === 'signalReconnecting';
        if (name === 'disconnected' || name === 'failed') {
          // 意外掉线：直接标 reconnecting 并重进，勿先推 disconnected（会放行 JPEG 双抓屏黑闪）
          if (room === nextRoom) room = null;
          if (!intentionalStop) scheduleAutoReconnect(name);
          else {
            post('state', { connectionState: name, transport: 'livekit' });
          }
          return;
        }
        post('state', {
          connectionState: live ? (name === 'connected' || name === connectedEnum ? 'connected' : 'reconnecting') : name,
          transport: 'livekit',
        });
      });
      nextRoom.on(LK.RoomEvent.DataReceived, (payload) => {
        if (room !== nextRoom) return;
        try {
          const text = (typeof TextDecoder !== 'undefined')
            ? new TextDecoder().decode(payload)
            : String(payload || '');
          const msg = JSON.parse(text);
          if (msg) post('control', { payload: msg });
        } catch (error) {
          post('error', { message: 'control_decode_failed:' + String((error && error.message) || error) });
        }
      });

      await nextRoom.connect(url, token, { autoSubscribe: false });
      if (myEpoch !== roomEpoch || room !== nextRoom) {
        try { await nextRoom.disconnect(); } catch (_) {}
        return;
      }
      await nextRoom.localParticipant.publishTrack(videoTrack, {
        name: 'desktop',
        source: LK.Track.Source.ScreenShare,
        simulcast: false,
        videoEncoding: { maxBitrate: 900_000, maxFramerate: 15 },
      });
      publishedTrack = videoTrack;
      reconnectAttempt = 0;
      post('signal', {
        type: 'webrtc_offer',
        desktopSessionId: sessionId,
        transport: 'livekit',
        sdp: 'livekit',
      });
      post('ready', { desktopSessionId: sessionId, transport: 'livekit' });
      post('state', { connectionState: 'connected', transport: 'livekit' });
    } catch (error) {
      const msg = String((error && error.message) || error || 'start_failed');
      post('error', { message: msg });
      const captureTimeout = /getDisplayMedia_timeout/i.test(msg);
      if (captureTimeout) {
        // 立刻停轨放行 JPEG；拉长退避后再试，避免与屏幕墙硬拉叠成风暴
        await stopMedia(false);
        if (!intentionalStop && lastUrl && lastToken) {
          reconnectAttempt = Math.max(reconnectAttempt || 0, 4);
          scheduleAutoReconnect('getDisplayMedia_timeout');
        }
      } else if (!intentionalStop && lastUrl && lastToken && localStream) {
        scheduleAutoReconnect('start_failed');
      } else {
        await stopMedia(false);
      }
    } finally {
      starting = false;
      if (queuedCmd) {
        const next = queuedCmd;
        queuedCmd = null;
        void startSession(next);
      }
    }
  }

  async function runCommand(cmd) {
    const op = String((cmd && cmd.op) || '');
    if (op === 'start' || op === 'restart') {
      await startSession(Object.assign({}, cmd || {}, { op: op }));
      return;
    }
    if (op === 'signal') return;
    if (op === 'update-token') {
      const newToken = String((cmd && cmd.livekitToken) || '');
      if (newToken) lastToken = newToken;
      return;
    }
    if (op === 'stop') {
      intentionalStop = true;
      clearAutoReconnect();
      sessionId = '';
      lastUrl = '';
      lastToken = '';
      queuedCmd = null;
      roomEpoch += 1;
      await stopMedia(false);
      post('stopped', {});
    }
  }

  window.wxPub.onCommand((cmd) => {
    cmdChain = cmdChain.then(() => runCommand(cmd)).catch((error) => {
      post('error', { message: String((error && error.message) || error || 'command_failed') });
    });
  });

  post('booted', { transport: 'livekit', sdk: !!LK });
})();
</script>
</body>
</html>
