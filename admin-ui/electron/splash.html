<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>微信群控管理平台</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #202124;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      user-select: none;
      border: 1px solid #d0d7de;
      overflow: hidden;
    }
    .wrap { width: 100%; padding: 26px 30px; }
    .row { display: flex; align-items: center; gap: 18px; }
    /* Canvas 转圈：不依赖 CSS transform / GPU（主进程禁用了硬件加速） */
    #spinner {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: block;
    }
    .title { font-size: 18px; font-weight: 600; line-height: 1.35; }
    .status { margin-top: 8px; font-size: 13px; color: #5f6368; line-height: 1.35; }
    .bar {
      margin-top: 18px;
      height: 10px;
      background: #e8eef5;
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 8%;
      background: #1677ff;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <canvas id="spinner" width="96" height="96" aria-hidden="true"></canvas>
      <div>
        <div class="title">微信群控管理平台</div>
        <div class="status" id="status">正在启动，请稍候…</div>
      </div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8">
      <div class="fill" id="fill"></div>
    </div>
  </div>
  <script>
    (function () {
      var canvas = document.getElementById('spinner');
      var ctx = canvas && canvas.getContext && canvas.getContext('2d');
      var angle = 0;
      var running = true;

      function draw() {
        if (!ctx || !running) return;
        var w = canvas.width;
        var h = canvas.height;
        var cx = w / 2;
        var cy = h / 2;
        var r = Math.min(w, h) * 0.36;
        var line = Math.max(6, Math.round(r * 0.22));
        ctx.clearRect(0, 0, w, h);

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = '#d6e4ff';
        ctx.lineWidth = line;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, r, angle, angle + Math.PI * 1.35);
        ctx.strokeStyle = '#1677ff';
        ctx.lineWidth = line;
        ctx.lineCap = 'round';
        ctx.stroke();

        angle += 0.18;
        if (angle > Math.PI * 2) angle -= Math.PI * 2;
        setTimeout(draw, 33);
      }
      draw();

      window.__setProgress = function (payload) {
        var pct = Math.max(0, Math.min(100, Number(payload && payload.pct) || 0));
        var text = (payload && payload.text) || '正在启动，请稍候…';
        var fill = document.getElementById('fill');
        var status = document.getElementById('status');
        var bar = document.querySelector('.bar');
        if (fill) fill.style.width = pct + '%';
        if (status) status.textContent = text;
        if (bar) bar.setAttribute('aria-valuenow', String(pct));
      };
      window.__setProgress({ pct: 8, text: '正在启动，请稍候…' });
    })();
  </script>
</body>
</html>
